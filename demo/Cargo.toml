[package]
name = "quadqr-demo"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
quadqr.workspace = true
image.workspace = true
eframe = "0.36.2"
egui_extras = { version = "0.36", features = ["svg", "image"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
rfd = "0.17.2"
crossbeam-channel = "0.5"
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }
base64 = "0.22"
