name: quadqr_flutter
description: Developer-friendly Flutter bindings for the native QuadQR Rust engine on Android.
version: 0.1.0
repository: https://github.com/akanshSirohi/QuadQR-SDK

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
